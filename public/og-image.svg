<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="badgeFrame">
      <rect x="120" y="120" width="140" height="140" rx="24" ry="24" />
    </clipPath>
    <clipPath id="badgeSlice">
      <rect x="120" y="181" width="140" height="10" />
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#050508" />

  <!-- ambient glow -->
  <circle cx="120" cy="80" r="420" fill="#00aaff" opacity="0.08" />
  <circle cx="1180" cy="600" r="380" fill="#7b2fff" opacity="0.07" />

  <!-- faint scanlines -->
  <g opacity="0.05">
    <rect x="0" y="0" width="1200" height="1" fill="#c8f0ff" />
    <rect x="0" y="40" width="1200" height="1" fill="#c8f0ff" />
    <rect x="0" y="80" width="1200" height="1" fill="#c8f0ff" />
    <rect x="0" y="560" width="1200" height="1" fill="#c8f0ff" />
    <rect x="0" y="600" width="1200" height="1" fill="#c8f0ff" />
  </g>

  <!-- TS monogram badge -->
  <g clip-path="url(#badgeFrame)">
    <rect x="120" y="120" width="140" height="140" fill="#080d1a" />
    <text x="190" y="228" text-anchor="middle" font-family="Bebas Neue" font-size="82" letter-spacing="1" fill="#00aaff">TS</text>
    <g clip-path="url(#badgeSlice)">
      <text x="192" y="228" text-anchor="middle" font-family="Bebas Neue" font-size="82" letter-spacing="1" fill="#7b2fff">TS</text>
    </g>
  </g>
  <rect x="122" y="122" width="136" height="136" rx="22" ry="22" fill="none" stroke="#00aaff" stroke-opacity="0.4" stroke-width="2" />

  <!-- wordmark -->
  <text x="120" y="345" font-family="Bebas Neue" font-size="104" letter-spacing="3" fill="#ffffff">THIAGO SOUZA</text>

  <!-- subheading -->
  <text x="122" y="392" font-family="Rajdhani SemiBold" font-size="34" letter-spacing="6" fill="#00aaff">FULL-STACK DEVELOPER</text>

  <!-- divider -->
  <rect x="122" y="430" width="360" height="2" fill="#00aaff" opacity="0.5" />

  <!-- tagline -->
  <text x="122" y="475" font-family="Manrope" font-weight="500" font-size="26" fill="#8a97a6">Building things for the web</text>
</svg>
